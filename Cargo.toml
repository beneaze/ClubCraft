[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/beneaze/ClubCraft"

[workspace.lints.rust]
# Unsafe code is limited to the FFI and real-time modules that allow it explicitly.
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash: no unwrap / expect / panic outside tests (see clippy.toml and AGENTS.md).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
# DSP loops index several buffers with one variable; iterator chains would hide that.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"

[workspace.dependencies]
clubcraft-core = { path = "crates/core" }
clubcraft-audio = { path = "crates/audio" }
clubcraft-stems = { path = "crates/stems" }
clubcraft-analysis = { path = "crates/analysis" }
clubcraft-engine = { path = "crates/engine" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
realfft = "3.5"
rustfft = "6"
rtrb = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"

# Real-time DSP and ML pre/post-processing must be fast even in dev builds.
[profile.dev.package.clubcraft-engine]
opt-level = 3
[profile.dev.package.clubcraft-stems]
opt-level = 3
[profile.dev.package.clubcraft-analysis]
opt-level = 3
[profile.dev.package.clubcraft-audio]
opt-level = 3
