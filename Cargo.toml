[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clubcraft/clubcraft"

[workspace.dependencies]
clubcraft-core = { path = "crates/core" }
clubcraft-audio = { path = "crates/audio" }
clubcraft-stems = { path = "crates/stems" }
clubcraft-analysis = { path = "crates/analysis" }
clubcraft-engine = { path = "crates/engine" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1"
realfft = "3.5"
rustfft = "6"
rtrb = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"

# Real-time DSP and ML pre/post-processing must be fast even in dev builds.
[profile.dev.package.clubcraft-engine]
opt-level = 3
[profile.dev.package.clubcraft-stems]
opt-level = 3
[profile.dev.package.clubcraft-analysis]
opt-level = 3
[profile.dev.package.clubcraft-audio]
opt-level = 3
