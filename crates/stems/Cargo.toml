[package]
name = "clubcraft-stems"
description = "HTDemucs stem separation for ClubCraft (CoreML GPU / ONNX Runtime CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clubcraft-core.workspace = true
clubcraft-audio.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
realfft = "3.5"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-24"] }
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSString", "NSURL", "NSValue", "NSError", "NSObject"] }
objc2-core-ml = { version = "0.3.2", features = ["MLModel", "MLModelConfiguration", "MLMultiArray", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLPredictionOptions", "block2"] }

[dev-dependencies]
hound = "3.5"
