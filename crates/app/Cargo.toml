[package]
name = "clubcraft"
version.workspace = true
edition.workspace = true
license.workspace = true

# The executable is "ClubCraft" (menu bar, Dock, Task Manager), the package stays `clubcraft`.
[[bin]]
name = "ClubCraft"
path = "src/main.rs"

[dependencies]
clubcraft-core.workspace = true
clubcraft-audio.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.36", features = ["image"] }
rfd = "0.17"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.38"
clubcraft-stems = { path = "../stems" }
clubcraft-analysis.workspace = true
clubcraft-engine.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
